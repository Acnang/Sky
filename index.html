<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Air Combat</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script></head>
<body><div id="game"><div id="hud"><div class="row"><span>속도 <b id="speed">0</b></span><span>격추 <b id="score">0</b></span><span id="view">3인칭</span></div><div class="gaugebox"><div class="row"><b>BOOST</b><b id="boostText">100%</b></div><div class="gauge"><div id="boostFill"></div></div></div><small>WASD/방향키 비행 · Space 발사 · Shift 부스트 · V 시점</small></div>
<div id="message"></div><div id="controls"><div><button id="up">▲</button><div class="row"><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div></div><div class="row"><button id="fire">발사</button><button id="boost">BOOST</button><button id="viewBtn">시점</button></div></div>
<div id="overlay"><div class="card"><h1>AIR COMBAT</h1><p>작은 풍선 2개가 사진 현수막을 매답니다.</p><p class="small">1.jpg, 2.jpg, 3.jpg, 4.jpg 파일을 저장소 루트에 올리세요.</p><button id="start">게임 시작</button></div></div></div><script src="game.js"></script></body></html>
